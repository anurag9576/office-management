<div class="forgot-password-container min-h-screen flex items-center justify-center p-4">
    <div
        class="glass-card w-full max-w-md p-8 rounded-2xl shadow-2xl relative overflow-hidden backdrop-blur-lg border border-white/20">
        <!-- Brand/Logo Area -->
        <div class="text-center mb-8">
            <div
                class="brand-logo mx-auto w-16 h-16 bg-brand-1 rounded-xl flex items-center justify-center shadow-lg mb-4">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-10 h-10 text-white" fill="none" viewBox="0 0 24 24"
                    stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                </svg>
            </div>
            <h1 class="text-3xl font-bold text-slate-800 tracking-tight">Forgot Password?</h1>
            <p class="text-slate-600 mt-2">Enter your email and we'll send you a link to reset your password.</p>
        </div>

        <!-- Success Message -->
        <div *ngIf="isSuccess"
            class="bg-green-50 border border-green-200 text-green-700 px-4 py-3 rounded-xl mb-6 flex items-start space-x-3 animate-in fade-in duration-500">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-green-500 flex-shrink-0" fill="none"
                viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
            <div>
                <p class="font-semibold">Reset link sent!</p>
                <p class="text-sm">Please check your inbox (and spam folder) for further instructions.</p>
            </div>
        </div>

        <!-- Forgot Password Form -->
        <form *ngIf="!isSuccess" [formGroup]="forgotPasswordForm" (ngSubmit)="onSubmit()" class="space-y-6">
            <!-- Email Input -->
            <div class="input-group">
                <label for="email" class="block text-sm font-medium text-slate-700 mb-1">Email Address</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-400">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                            <path d="M2.003 5.884L10 9.882l7.997-3.998A2 2 0 0016 4H4a2 2 0 00-1.997 1.884z" />
                            <path d="M18 8.118l-8 4-8-4V14a2 2 0 002 2h12a2 2 0 002-2V8.118z" />
                        </svg>
                    </span>
                    <input type="email" id="email" formControlName="email" placeholder="name@company.com"
                        class="block w-full pl-10 pr-3 py-3 border border-brand-1/30 rounded-xl focus:ring-2 focus:ring-brand-1 focus:border-brand-1 outline-none transition-all hover:border-brand-1/50"
                        [ngClass]="{'border-red-500': forgotPasswordForm.get('email')?.touched && forgotPasswordForm.get('email')?.errors}">
                </div>
                <p *ngIf="forgotPasswordForm.get('email')?.touched && forgotPasswordForm.get('email')?.errors?.['required']"
                    class="text-xs text-red-500 mt-1">Email is required</p>
                <p *ngIf="forgotPasswordForm.get('email')?.touched && forgotPasswordForm.get('email')?.errors?.['email']"
                    class="text-xs text-red-500 mt-1">Please enter a valid email</p>
            </div>

            <!-- Submit Button -->
            <button type="submit" [disabled]="isLoading"
                class="w-full bg-brand-1 hover:bg-brand-5 text-white font-bold py-3 px-4 rounded-xl shadow-lg hover:shadow-xl transform active:scale-[0.98] transition-all flex items-center justify-center space-x-2 disabled:opacity-70 disabled:cursor-not-allowed">
                <svg *ngIf="isLoading" class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg"
                    fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor"
                        d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
                    </path>
                </svg>
                <span>{{ isLoading ? 'Sending reset link...' : 'Send Reset Link' }}</span>
            </button>
        </form>

        <!-- Back to Login -->
        <div class="mt-6 text-center">
            <button (click)="goBack()"
                class="inline-flex items-center text-sm font-semibold text-brand-1 hover:text-brand-5 transition-colors group">
                <svg xmlns="http://www.w3.org/2000/svg"
                    class="h-4 w-4 mr-1 transform group-hover:-translate-x-1 transition-transform" fill="none"
                    viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M10 19l-7-7m0 0l7-7m-7 7h18" />
                </svg>
                Back to Login
            </button>
        </div>
    </div>

    <!-- Decorative Elements (Consistent with Login) -->
    <div class="absolute top-0 left-0 w-full h-full -z-10 overflow-hidden bg-slate-50">
        <div class="bg-pattern opacity-10 blur-3xl absolute -top-1/4 -left-1/4 w-full h-full rounded-full bg-brand-2">
        </div>
        <div
            class="bg-pattern opacity-10 blur-3xl absolute -bottom-1/4 -right-1/4 w-full h-full rounded-full bg-brand-1">
        </div>
    </div>
</div>
