<div class="login-container min-h-screen flex items-center justify-center p-4">
    <div
        class="glass-card w-full max-w-md p-8 rounded-2xl shadow-2xl relative overflow-hidden backdrop-blur-lg border border-white/20">
        <!-- Brand/Logo Area -->
        <div class="text-center mb-8">
            <div
                class="brand-logo mx-auto w-16 h-16 bg-brand-1 rounded-xl flex items-center justify-center shadow-lg mb-4">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-10 h-10 text-white" fill="none" viewBox="0 0 24 24"
                    stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-20 0h2m16-10H7m12 0v10m-14 0v-10" />
                </svg>
            </div>
            <h1 class="text-3xl font-bold text-slate-800 tracking-tight">Welcome Back</h1>
            <p class="text-slate-600 mt-2">Sign in to manage your office efficiently.</p>
        </div>

        <!-- Error Message -->
        <div *ngIf="loginError()"
            class="mb-6 p-4 bg-red-50 border border-red-100 rounded-xl text-red-600 text-sm font-semibold flex items-center space-x-2 animate-in fade-in slide-in-from-top-2">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 flex-shrink-0" viewBox="0 0 20 20"
                fill="currentColor">
                <path fill-rule="evenodd"
                    d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z"
                    clip-rule="evenodd" />
            </svg>
            <span>{{loginError()}}</span>
        </div>

        <!-- Login Form -->
        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-6">
            <!-- Email Input -->
            <div class="input-group">
                <label for="email" class="block text-sm font-medium text-slate-700 mb-1">Email Address</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-400">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                            <path d="M2.003 5.884L10 9.882l7.997-3.998A2 2 0 0016 4H4a2 2 0 00-1.997 1.884z" />
                            <path d="M18 8.118l-8 4-8-4V14a2 2 0 002 2h12a2 2 0 002-2V8.118z" />
                        </svg>
                    </span>
                    <input type="email" id="email" formControlName="email" placeholder="name@company.com"
                        class="block w-full pl-10 pr-3 py-3 border border-brand-1/30 rounded-xl focus:ring-2 focus:ring-brand-1 focus:border-brand-1 outline-none transition-all hover:border-brand-1/50"
                        [ngClass]="{'border-red-500': loginForm.get('email')?.touched && loginForm.get('email')?.errors}">
                </div>
                <p *ngIf="loginForm.get('email')?.touched && loginForm.get('email')?.errors?.['required']"
                    class="text-xs text-red-500 mt-1">Email is required</p>
                <p *ngIf="loginForm.get('email')?.touched && loginForm.get('email')?.errors?.['email']"
                    class="text-xs text-red-500 mt-1">Please enter a valid email</p>
            </div>

            <!-- Password Input -->
            <div class="input-group">
                <label for="password" class="block text-sm font-medium text-slate-700 mb-1">Password</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-400">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                            <path fill-rule="evenodd"
                                d="M5 9V7a5 5 0 0110 0v2a2 2 0 012 2v5a2 2 0 01-2 2H5a2 2 0 01-2-2v-5a2 2 0 012-2zm8-2v2H7V7a3 3 0 016 0z"
                                clip-rule="evenodd" />
                        </svg>
                    </span>
                    <input [type]="passwordVisible ? 'text' : 'password'" id="password" formControlName="password"
                        placeholder="••••••••"
                        class="block w-full pl-10 pr-10 py-3 border border-brand-1/30 rounded-xl focus:ring-2 focus:ring-brand-1 focus:border-brand-1 outline-none transition-all hover:border-brand-1/50"
                        [ngClass]="{'border-red-500': loginForm.get('password')?.touched && loginForm.get('password')?.errors}">
                    <button type="button" (click)="togglePasswordVisibility()"
                        class="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 hover:text-brand-1 transition-colors">
                        <svg *ngIf="!passwordVisible" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none"
                            viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                        </svg>
                        <svg *ngIf="passwordVisible" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none"
                            viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.542-7a9.97 9.97 0 011.563-3.046m4.599-4.599A9.96 9.96 0 0112 5c4.478 0 8.268 2.943 9.542 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21m-4.225-4.225L3 3" />
                        </svg>
                    </button>
                </div>
                <p *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.errors?.['required']"
                    class="text-xs text-red-500 mt-1">Password is required</p>
                <p *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.errors?.['minlength']"
                    class="text-xs text-red-500 mt-1">Password must be at least 6 characters</p>
            </div>

            <!-- Remember Me & Forgot Password -->
            <div class="flex items-center justify-between">
                <label class="flex items-center cursor-pointer group">
                    <input type="checkbox" formControlName="rememberMe" class="hidden peer">
                    <div
                        class="w-5 h-5 border border-slate-300 rounded peer-checked:bg-brand-1 peer-checked:border-brand-1 flex items-center justify-center transition-all mr-2">
                        <svg xmlns="http://www.w3.org/2000/svg"
                            class="h-3.5 w-3.5 text-white scale-0 peer-checked:scale-100 transition-transform"
                            fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7" />
                        </svg>
                    </div>
                    <span class="text-sm text-slate-600 group-hover:text-slate-800 transition-colors">Remember me</span>
                </label>
                <a routerLink="/forgot-password"
                    class="text-sm font-semibold text-brand-1 hover:text-brand-5 transition-colors">Forgot
                    Password?</a>
            </div>

            <!-- Login Button -->
            <button type="submit" [disabled]="isLoading"
                class="w-full bg-brand-1 hover:bg-brand-5 text-white font-bold py-3 px-4 rounded-xl shadow-lg hover:shadow-xl transform active:scale-[0.98] transition-all flex items-center justify-center space-x-2 disabled:opacity-70 disabled:cursor-not-allowed">
                <svg *ngIf="isLoading" class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg"
                    fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor"
                        d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
                    </path>
                </svg>
                <span>{{ isLoading ? 'Checking credentials...' : 'Sign In' }}</span>
            </button>

        </form>
    </div>

    <!-- Decorative Elements -->
    <div class="absolute top-0 left-0 w-full h-full -z-10 overflow-hidden bg-slate-50">
        <div class="bg-pattern opacity-10 blur-3xl absolute -top-1/4 -left-1/4 w-full h-full rounded-full bg-brand-2">
        </div>
        <div
            class="bg-pattern opacity-10 blur-3xl absolute -bottom-1/4 -right-1/4 w-full h-full rounded-full bg-brand-1">
        </div>
    </div>
</div>
