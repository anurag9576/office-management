<aside
    [class]="'h-screen flex flex-col shadow-2xl transition-all duration-300 bg-brand-5 border-r border-white/10 relative overflow-hidden ' + (isCollapsed() ? 'w-24' : 'w-72')">
    <!-- Overlay for depth -->
    <div class="absolute inset-0 bg-black/10 pointer-events-none"></div>

    <!-- Brand Section (Clickable to toggle) -->
    <div (click)="toggleSidebar()"
        class="p-5 flex flex-col items-center justify-center border-b border-white/5 relative z-10 cursor-pointer hover:bg-white/5 transition-all">
        <div
            class="brand-logo mb-3 w-14 h-14 rounded-2xl flex items-center justify-center shadow-2xl transition-all hover:scale-110 duration-500 bg-gradient-to-br from-brand-1 to-brand-4 relative overflow-hidden ring-4 ring-white/10">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-8 h-8 text-white relative z-10" fill="none"
                viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-20 0h2m16-10H7m12 0v10m-14 0v-10" />
            </svg>
        </div>
        <h1 *ngIf="!isCollapsed()"
            class="text-xl font-black tracking-tighter uppercase text-white drop-shadow-md animate-fade-in">
            {{brandName()}}
        </h1>
    </div>

    <!-- Navigation List (Compact and Auto-scrolling WITHOUT bar) -->
    <nav class="flex-1 overflow-y-auto py-4 px-5 space-y-1 custom-scrollbar-hidden relative z-10">
        <div *ngIf="!isCollapsed()"
            class="px-4 mb-3 text-[10px] font-black uppercase tracking-[0.3em] text-white/40 animate-fade-in">Management
        </div>

        <a *ngFor="let item of navItems()" [routerLink]="item.route" routerLinkActive="active-nav"
            [routerLinkActiveOptions]="{exact: true}" [title]="isCollapsed() ? item.label : ''"
            [class.justify-center]="isCollapsed()" [class.px-0]="isCollapsed()" [class.px-4]="!isCollapsed()"
            class="group flex items-center py-3 rounded-2xl transition-all duration-300 relative overflow-hidden text-brand-2 hover:text-white">

            <div class="absolute inset-0 bg-white/5 opacity-0 group-hover:opacity-100 transition-opacity"></div>

            <div class="icon-container p-2 rounded-xl transition-all duration-300 bg-white/5 border border-white/5 group-hover:bg-brand-1 group-hover:text-white group-hover:scale-110 group-hover:shadow-lg group-hover:shadow-brand-1/20 shrink-0"
                [class.mr-4]="!isCollapsed()" [class.mx-auto]="isCollapsed()">
                <ng-container [ngSwitch]="item.icon">
                    <svg *ngSwitchCase="'dashboard'" xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none"
                        viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
                    </svg>
                    <svg *ngSwitchCase="'vacation'" xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none"
                        viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364-6.364l-.707.707M6.343 17.657l-.707.707m12.728 0l-.707-.707M6.343 6.343l-.707-.707m12.728 0m-6.386-11.314l-.707-.707" />
                    </svg>
                    <svg *ngSwitchCase="'payments'" xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none"
                        viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M12 8c-1.657 0-3 1.343-3 3s1.343 3 3 3 3 1.343 3 3-1.343 3-3 3m0-12c-1.657 0-3-1.343-3-3s1.343-3 3-3 3 1.343 3 3-1.343 3-3 3m0 12a9 9 0 110-18 9 9 0 010 18z" />
                    </svg>
                    <svg *ngSwitchCase="'campaign'" xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none"
                        viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M11 5.882V19.24a1.76 1.76 0 01-3.417.592l-2.147-6.15M18 13a3 3 0 100-6M5.436 13.683A4.001 4.001 0 017 6h1.832c4.1 0 7.625-1.234 9.168-3v14c-1.543-1.766-5.067-3-9.168-3H7a3.988 3.988 0 01-1.564-.317z" />
                    </svg>
                    <svg *ngSwitchCase="'person'" xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none"
                        viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                    </svg>
                    <svg *ngSwitchCase="'help_outline'" xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none"
                        viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                    </svg>
                </ng-container>
            </div>

            <span *ngIf="!isCollapsed()"
                class="font-bold text-sm transition-all tracking-wide relative z-10 animate-fade-in truncate">{{item.label}}</span>
            <div
                class="active-dot absolute right-3 w-1 h-5 rounded-full bg-white opacity-0 transition-all scale-y-0 origin-center">
            </div>
        </a>

        <!-- Logout Item (Relocated Below Help) -->
        <button (click)="onLogout()" [title]="isCollapsed() ? 'Logout' : ''" [class.justify-center]="isCollapsed()"
            [class.px-0]="isCollapsed()" [class.px-4]="!isCollapsed()"
            class="group w-full flex items-center py-3 rounded-2xl transition-all duration-300 relative overflow-hidden text-brand-2 hover:text-red-400">
            <div class="absolute inset-0 bg-red-400/5 opacity-0 group-hover:opacity-100 transition-opacity"></div>
            <div class="icon-container p-2 rounded-xl transition-all duration-300 bg-white/5 border border-white/5 group-hover:bg-red-500 group-hover:text-white group-hover:scale-110 group-hover:shadow-lg group-hover:shadow-red-500/20 shrink-0 text-red-400"
                [class.mr-4]="!isCollapsed()" [class.mx-auto]="isCollapsed()">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24"
                    stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
                </svg>
            </div>
            <span *ngIf="!isCollapsed()"
                class="font-bold text-sm transition-all tracking-wide relative z-10 animate-fade-in">Logout</span>
        </button>
    </nav>

    <!-- Support/Footer Section -->
    <div class="p-4 border-t border-white/5 relative z-10">
        <div class="p-3 rounded-xl flex items-center bg-white/5 border border-white/5 hover:bg-white/10 transition-all cursor-pointer group/user shadow-lg shadow-black/10 min-w-0"
            [title]="isCollapsed() ? user().name : ''">
            <div class="w-9 h-9 rounded-lg flex items-center justify-center bg-brand-1 text-white font-black shadow-lg group-hover/user:scale-105 transition-transform shrink-0"
                [class.mr-3]="!isCollapsed()" [class.mx-auto]="isCollapsed()">
                <span class="text-[14px]">{{user().initials}}</span>
            </div>
            <div *ngIf="!isCollapsed()" class="flex-1 min-w-0 animate-fade-in">
                <p class="text-[12px] font-black text-white truncate leading-tight">{{user().name}}</p>
                <p class="text-[9px] text-brand-2 truncate font-black uppercase tracking-wider mt-0.5">{{user().role}}
                </p>
            </div>
        </div>
    </div>
</aside>

<!-- Logout Confirmation Modal -->
<div *ngIf="showLogoutModal()" class="fixed inset-0 z-[100] flex items-center justify-center p-4">
    <!-- Backdrop with blur -->
    <div class="absolute inset-0 bg-slate-900/60 backdrop-blur-sm transition-opacity" (click)="cancelLogout()"></div>

    <!-- Modal Card (Centered) -->
    <div
        class="bg-white rounded-[1rem] shadow-2xl relative z-10 w-full max-w-[460px] overflow-hidden transform transition-all animate-in zoom-in-95 duration-200 shadow-brand-3/30 border border-brand-2/10">
        <div class="p-8 text-center">
            <div
                class="w-16 h-16 bg-red-50 rounded-2xl flex items-center justify-center text-red-500 mx-auto mb-4 shadow-sm">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24"
                    stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
                </svg>
            </div>

            <h3 class="text-xl font-black text-slate-800 mb-2 tracking-tight">Logout?</h3>
            <p class="text-slate-500 font-medium text-xs mb-6 leading-relaxed px-2">Are you sure you want to exit your
                session?</p>

            <div class="flex gap-4">
                <button (click)="cancelLogout()"
                    class="flex-1 py-3 bg-slate-100 hover:bg-brand-2 hover:text-brand-5 text-slate-500 font-bold rounded-xl transition-all active:scale-95 text-sm cursor-pointer border border-transparent hover:border-brand-2 shadow-sm">
                    No
                </button>
                <button (click)="confirmLogout()"
                    class="flex-1 py-3 bg-brand-5 hover:bg-brand-1 text-white font-black rounded-xl transition-all shadow-lg hover:shadow-brand-1/20 active:scale-95 text-sm cursor-pointer">
                    Yes
                </button>
            </div>
        </div>
    </div>
</div>
