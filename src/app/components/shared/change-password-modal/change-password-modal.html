    <div class="fixed inset-0 z-[9999] flex items-center justify-center bg-slate-900/60 backdrop-blur-sm p-4">
    <div class="bg-white w-full max-w-sm rounded-3xl shadow-2xl p-8 animate-in zoom-in duration-300">
        <!-- Heading -->
        <h2 class="text-xl font-bold text-slate-800 text-center mb-6">Create New Password</h2>

        <form [formGroup]="passwordForm" (ngSubmit)="onSubmit()" class="space-y-5">
            <!-- New Password -->
            <div class="space-y-1">
                <label class="text-[10px] font-bold text-slate-400 uppercase tracking-widest ml-1">New Password</label>
                <div class="relative">
                    <input [type]="passwordVisible() ? 'text' : 'password'" 
                        formControlName="newPassword"
                        class="w-full px-5 py-4 bg-slate-50 border border-slate-100 rounded-2xl text-xs font-semibold text-slate-700 focus:outline-none focus:border-brand-1 focus:bg-white transition-all pr-12"
                        placeholder="Enter new password">
                    <button type="button" (click)="togglePasswordVisibility()" class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 hover:text-brand-1 transition-colors">
                        <svg *ngIf="!passwordVisible()" xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                        </svg>
                        <svg *ngIf="passwordVisible()" xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.542-7a9.97 9.97 0 011.563-3.046m4.599-4.599A9.96 9.96 0 0112 5c4.478 0 8.268 2.943 9.542 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21m-4.225-4.225L3 3" />
                        </svg>
                    </button>
                </div>
            </div>

            <!-- Confirm Password -->
            <div class="space-y-1">
                <label class="text-[10px] font-bold text-slate-400 uppercase tracking-widest ml-1">Confirm Password</label>
                <div class="relative">
                    <input [type]="confirmPasswordVisible() ? 'text' : 'password'" 
                        formControlName="confirmPassword"
                        class="w-full px-5 py-4 bg-slate-50 border border-slate-100 rounded-2xl text-xs font-semibold text-slate-700 focus:outline-none focus:border-brand-1 focus:bg-white transition-all pr-12"
                        placeholder="Confirm new password">
                    <button type="button" (click)="toggleConfirmVisibility()" class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 hover:text-brand-1 transition-colors">
                        <svg *ngIf="!confirmPasswordVisible()" xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                        </svg>
                        <svg *ngIf="confirmPasswordVisible()" xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.542-7a9.97 9.97 0 011.563-3.046m4.599-4.599A9.96 9.96 0 0112 5c4.478 0 8.268 2.943 9.542 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21m-4.225-4.225L3 3" />
                        </svg>
                    </button>
                </div>
                <!-- ... error below -->

                <div *ngIf="passwordForm.errors?.['mismatch'] && passwordForm.get('confirmPassword')?.touched" class="text-[10px] text-red-500 font-bold mt-1 ml-1">
                    Passwords do not match.
                </div>
            </div>

            <!-- Error Message -->
            <div *ngIf="errorMessage()" class="p-3 bg-red-50 border border-red-100 rounded-xl text-red-600 text-[10px] font-bold text-center">
                {{ errorMessage() }}
            </div>

            <!-- Submit Button -->
            <button type="submit" 
                [disabled]="isLoading() || passwordForm.invalid"
                class="w-full py-4 bg-brand-1 text-white rounded-2xl font-bold text-xs uppercase tracking-widest shadow-lg shadow-brand-1/20 hover:bg-brand-5 transition-all active:scale-95 disabled:opacity-50 disabled:cursor-not-allowed">
                <span *ngIf="!isLoading()">Update Password</span>
                <div *ngIf="isLoading()" class="w-5 h-5 border-2 border-white/30 border-t-white rounded-full animate-spin mx-auto"></div>
            </button>
        </form>
    </div>
</div>
