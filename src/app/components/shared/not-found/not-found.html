<div class="min-h-screen bg-slate-50 flex items-center justify-center p-6">
  <div class="max-w-md w-full text-center space-y-8 animate-in fade-in zoom-in duration-500">
    <!-- 404 Illustration Area -->
    <div class="relative">
      <h1 class="text-[12rem] font-black text-slate-200 leading-none select-none">404</h1>
      <div class="absolute inset-0 flex items-center justify-center">
        <div class="w-32 h-32 bg-brand-5/10 rounded-full flex items-center justify-center animate-bounce duration-[2000ms]">
          <span class="material-symbols-outlined text-[4rem] text-brand-5">construction</span>
        </div>
      </div>
    </div>

    <div class="space-y-3">
      <h2 class="text-3xl font-black text-slate-800 tracking-tight">Under Construction</h2>
      <p class="text-slate-500 text-sm font-medium leading-relaxed">
        The page you are looking for is currently being worked on or doesn't exist yet. 
        We're building something great for you!
      </p>
    </div>

    <div class="pt-4">
      <button (click)="goHome()" 
         class="inline-flex items-center gap-2 px-8 py-4 bg-brand-5 text-white rounded-2xl font-black uppercase tracking-widest text-xs hover:bg-brand-1 transition-all shadow-xl shadow-brand-5/20 hover:-translate-y-1 active:scale-95 cursor-pointer border-none">
        <span class="material-symbols-outlined text-base">home</span>
        Back to Dashboard
      </button>
    </div>

    <p class="text-[10px] font-black text-slate-400 uppercase tracking-[0.2em]">Hamsa Hitech Office Management</p>
  </div>
</div>
