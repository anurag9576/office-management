<header
    class="navbar-container flex items-center justify-between px-6 h-16 border-b border-brand-1/30 bg-white shadow-sm z-20">
    <!-- Left side: Search and Breadcrumb-like title -->
    <div class="flex items-center space-x-3 md:space-x-6">
        <h2 class="text-brand-5 font-bold text-sm md:text-lg whitespace-nowrap">{{currentTitle()}}</h2>

        <div class="relative group hidden sm:block">
            <span
                class="absolute inset-y-0 left-0 pl-3 flex items-center text-brand-3 group-focus-within:text-brand-1 transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24"
                    stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                </svg>
            </span>
            <input type="text" placeholder="Search..."
                class="bg-brand-2/10 border border-brand-2/20 rounded-lg pl-9 pr-4 py-1.5 text-sm outline-none focus:ring-2 focus:ring-brand-1/20 focus:border-brand-1 focus:bg-white w-32 md:w-64 transition-all" />
        </div>
    </div>

    <!-- Right side: Notifications, Time, Actions -->
    <div class="flex items-center space-x-4">
        <!-- Date/Time Display -->
        <div class="hidden md:flex flex-col items-end mr-4">
            <span class="text-xs font-bold text-brand-5 tracking-wider">{{ currentTime | date:'EEEE, MMM d' }}</span>
            <span class="text-[10px] text-brand-3 font-medium">{{ currentTime | date:'h:mm:ss a' }}</span>
        </div>

        <!-- Notifications Dropdown -->
        <div class="relative">
            <button (click)="toggleNotifications()"
                class="p-2 text-brand-3 hover:text-brand-1 hover:bg-brand-1/10 rounded-lg transition-all relative"
                [class.bg-brand-1/10]="showNotificationsDropdown()" [class.text-brand-1]="showNotificationsDropdown()">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24"
                    stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
                </svg>
                <!-- Notification Badge with Count -->
                <span
                    class="absolute -top-0.5 -right-0.5 min-w-[18px] h-[18px] flex items-center justify-center bg-red-500 text-white text-[10px] font-black rounded-full border-2 border-white shadow-sm px-1">
                    3
                </span>
            </button>

            <!-- Notification Menu -->
            <div *ngIf="showNotificationsDropdown()"
                class="fixed sm:absolute left-1/2 sm:left-auto -translate-x-1/2 sm:translate-x-0 sm:right-0 top-[60px] sm:top-auto mt-2 w-[calc(100vw-32px)] sm:w-[340px] bg-white rounded-2xl shadow-2xl border border-slate-100 z-[150] animate-in fade-in zoom-in-95 duration-200 origin-top overflow-hidden">
                <!-- Header -->
                <div class="px-4 py-3 border-b border-slate-50 flex items-center justify-between bg-slate-50/50">
                    <h3 class="text-sm font-black text-slate-800 uppercase tracking-wider">Notifications</h3>
                    <span class="px-2 py-0.5 bg-brand-1 text-white text-[10px] font-bold rounded-full">3 New</span>
                </div>

                <!-- List -->
                <div class="max-h-[400px] overflow-y-auto">
                    <div *ngFor="let note of notifications"
                        class="p-4 border-b border-slate-50 hover:bg-brand-1/5 transition-colors cursor-pointer group/note">
                        <div class="flex gap-4">
                            <div class="w-10 h-10 rounded-xl flex items-center justify-center shrink-0 transition-transform group-hover/note:scale-110"
                                [ngClass]="note.color">
                                <span class="material-symbols-outlined text-[20px]">{{note.icon}}</span>
                            </div>
                            <div class="flex-1">
                                <div class="flex justify-between items-start mb-1">
                                    <h4 class="text-xs font-bold text-slate-900">{{note.title}}</h4>
                                    <span class="text-[10px] text-slate-400 font-medium">{{note.time}}</span>
                                </div>
                                <p class="text-[11px] text-slate-500 leading-relaxed">{{note.message}}</p>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Footer -->
                <button
                    class="w-full py-3 text-brand-1 text-xs font-bold hover:bg-brand-1 hover:text-white transition-all">
                    View All Notifications
                </button>
            </div>
        </div>

        <!-- Settings Dropdown -->
        <div class="relative">
            <button (click)="toggleSettings()"
                class="p-2 text-brand-3 hover:text-brand-1 hover:bg-brand-1/10 rounded-lg transition-all"
                [class.bg-brand-1/10]="showSettingsDropdown()" [class.text-brand-1]="showSettingsDropdown()">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24"
                    stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                </svg>
            </button>

            <!-- Dropdown Menu -->
            <div *ngIf="showSettingsDropdown()"
                class="fixed sm:absolute right-4 sm:right-0 top-[60px] sm:top-auto mt-2 w-48 bg-white rounded-xl shadow-2xl border border-slate-100 py-1.5 z-[150] animate-in fade-in zoom-in-95 duration-200 origin-top-right overflow-hidden">
                <button (click)="navigateToForgot()"
                    class="w-full flex items-center px-4 py-2.5 text-sm font-black text-slate-700 hover:bg-brand-1 hover:text-white transition-all group/item">
                    <span
                        class="material-symbols-outlined text-[18px] mr-3 text-brand-3 group-hover/item:text-white transition-colors">lock_reset</span>
                    Forgot Password
                </button>
            </div>
        </div>
    </div>
</header>
