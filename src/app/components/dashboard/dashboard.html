<div class="dashboard-layout h-screen flex overflow-hidden bg-brand-5 relative">
    <!-- Blocking Modal (Full Screen) -->
    <app-change-password-modal *ngIf="showChangePasswordModal()" (passwordChanged)="onPasswordChanged()"></app-change-password-modal>

    <!-- Sidebar -->
    <app-sidebar></app-sidebar>

    <!-- Main Content Area -->
    <div class="flex-1 flex flex-col min-w-0 overflow-hidden relative">
        <!-- Top Navbar -->
        <app-navbar></app-navbar>

        <!-- Content Area (with brand-theme consistency) -->
        <main class="flex-1 overflow-y-auto p-4 md:p-8 custom-scrollbar relative bg-white/5 shadow-inner">
            <router-outlet></router-outlet>
        </main>
    </div>
</div>
