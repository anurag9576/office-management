<div class="p-4 md:p-8 animate-in fade-in slide-in-from-bottom-5 duration-500">
    <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-8">
        <div>
            <h1 class="text-2xl md:text-3xl font-semibold text-slate-900 tracking-tighter">Leave Management</h1>
            <p class="text-xs font-medium text-slate-400 uppercase tracking-widest mt-1">Approve or reject employee
                leave
                requests</p>
        </div>
    </div>

    <div class="bg-white rounded-[2.5rem] shadow-xl border border-slate-100 overflow-hidden">
        <div class="overflow-x-auto">
            <table class="w-full text-left">
                <thead>
                    <tr class="bg-slate-50/50 border-b border-slate-100">
                        <th
                            class="px-8 py-5 text-[10px] font-black text-slate-900 uppercase tracking-widest group/th cursor-pointer">
                            <div class="flex items-center gap-1">
                                Employee
                                <span
                                    class="material-symbols-outlined text-[6px] opacity-0 group-hover/th:opacity-100 transition-opacity text-brand-1">arrow_upward</span>
                            </div>
                        </th>
                        <th
                            class="px-8 py-5 text-[10px] font-black text-slate-900 uppercase tracking-widest group/th cursor-pointer">
                            <div class="flex items-center gap-1">
                                Type
                                <span
                                    class="material-symbols-outlined text-[6px] opacity-0 group-hover/th:opacity-100 transition-opacity text-brand-1">arrow_upward</span>
                            </div>
                        </th>
                        <th
                            class="px-8 py-5 text-[10px] font-black text-slate-900 uppercase tracking-widest group/th cursor-pointer">
                            <div class="flex items-center gap-1">
                                Duration
                                <span
                                    class="material-symbols-outlined text-[6px] opacity-0 group-hover/th:opacity-100 transition-opacity text-brand-1">arrow_upward</span>
                            </div>
                        </th>
                        <th
                            class="px-8 py-5 text-[10px] font-black text-slate-900 uppercase tracking-widest group/th cursor-pointer">
                            <div class="flex items-center gap-1">
                                Status
                                <span
                                    class="material-symbols-outlined text-[6px] opacity-0 group-hover/th:opacity-100 transition-opacity text-brand-1">arrow_upward</span>
                            </div>
                        </th>
                        <th
                            class="px-8 py-5 text-[10px] font-black text-slate-900 uppercase tracking-widest text-right">
                            Actions
                        </th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-slate-50">
                    <tr *ngFor="let request of leaveRequests(); let i = index"
                        class="hover:bg-slate-50/50 transition-colors">
                        <td class="px-8 py-5 text-sm font-semibold text-slate-800">{{request.name}}</td>
                        <td class="px-8 py-5 text-sm font-medium text-slate-600">{{request.type}}</td>
                        <td class="px-8 py-5 text-sm font-medium text-slate-600">{{request.duration}}</td>
                        <td class="px-8 py-5">
                            <span
                                [class]="'px-3 py-1 rounded-lg text-[10px] font-semibold uppercase tracking-wider ' + 
                                (request.status === 'Approved' ? 'bg-emerald-100 text-emerald-600' : 
                                 request.status === 'Rejected' ? 'bg-red-100 text-red-600' : 'bg-amber-100 text-amber-600')">
                                {{request.status}}
                            </span>
                        </td>
                        <td class="px-8 py-5">
                            <div *ngIf="request.status === 'Pending'" class="flex items-center justify-end gap-2">
                                <button (click)="approveLeave(i)"
                                    class="w-8 h-8 rounded-lg bg-emerald-50 text-emerald-500 flex items-center justify-center hover:bg-emerald-500 hover:text-white transition-all">
                                    <span class="material-symbols-outlined text-sm">check</span>
                                </button>
                                <button (click)="rejectLeave(i)"
                                    class="w-8 h-8 rounded-lg bg-red-50 text-red-500 flex items-center justify-center hover:bg-red-500 hover:text-white transition-all">
                                    <span class="material-symbols-outlined text-sm">close</span>
                                </button>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
