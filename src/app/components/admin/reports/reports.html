<div class="p-4 md:p-8 animate-in fade-in slide-in-from-bottom-5 duration-500">
    <div class="mb-12">
        <h1 class="text-2xl md:text-3xl font-black text-slate-900 tracking-tighter">Analytical Reports</h1>
        <p class="text-xs font-bold text-slate-400 uppercase tracking-widest mt-1">Data driven insights for office
            growth</p>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
        <div *ngFor="let report of reportTypes()"
            class="bg-white p-8 rounded-[2.5rem] shadow-xl border border-slate-100 hover:shadow-2xl hover:border-brand-1 transition-all group flex flex-col items-center text-center">
            <div
                [class]="'w-16 h-16 ' + report.color + '/10 rounded-2xl flex items-center justify-center mb-6 group-hover:scale-110 transition-transform'">
                <span
                    [class]="'material-symbols-outlined text-4xl ' + report.color.replace('bg-', 'text-')">{{report.icon}}</span>
            </div>

            <h3 class="text-sm font-black text-slate-800 mb-2 truncate w-full">{{report.name}}</h3>
            <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-8">Generated: 01 Mar 2025</p>

            <button
                class="w-full py-3 bg-slate-50 text-slate-400 rounded-xl font-black uppercase text-[10px] tracking-widest hover:bg-brand-1 hover:text-white transition-all">Download
                CSV</button>
        </div>
    </div>
</div>
