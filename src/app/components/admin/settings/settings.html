<div class="p-4 md:p-8 animate-in fade-in slide-in-from-bottom-5 duration-500">
    <div class="mb-10">
        <h1 class="text-2xl md:text-3xl font-black text-slate-900 tracking-tighter">System Configuration</h1>
        <p class="text-xs font-bold text-slate-400 uppercase tracking-widest mt-1">Control your organization parameters
        </p>
    </div>

    <div class="max-w-4xl space-y-8">
        <div class="bg-white p-8 rounded-[2.5rem] shadow-xl border border-slate-100">
            <h3 class="text-lg font-black text-slate-800 mb-8 border-b border-slate-50 pb-4">General Settings</h3>

            <div class="space-y-6">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                    <div class="space-y-2">
                        <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-1">Company
                            Branding</label>
                        <input type="text" [value]="config().companyName"
                            class="w-full bg-slate-50 border border-slate-100 rounded-2xl px-5 py-4 text-slate-800 font-bold outline-none focus:bg-white focus:border-brand-1 transition-all">
                    </div>
                    <div class="space-y-2">
                        <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-1">System
                            Timezone</label>
                        <select
                            class="w-full bg-slate-50 border border-slate-100 rounded-2xl px-5 py-4 text-slate-800 font-bold outline-none focus:bg-white focus:border-brand-1 transition-all">
                            <option>Asia/Kolkata (GMT +5:30)</option>
                            <option>UTC (GMT 0)</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>

        <div class="flex justify-end gap-4">
            <button
                class="px-8 py-4 rounded-2xl bg-slate-100 text-slate-400 font-black uppercase text-xs tracking-widest hover:bg-slate-200 transition-all">Reset
                Default</button>
            <button
                class="px-8 py-4 rounded-2xl bg-brand-5 text-white font-black uppercase text-xs tracking-widest shadow-xl shadow-brand-5/20 hover:bg-brand-1 transition-all">Save
                Changes</button>
        </div>
    </div>
</div>
