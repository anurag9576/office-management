<div class="p-4 md:p-8 animate-in fade-in slide-in-from-bottom-5 duration-500">
    <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-8">
        <div>
            <h1 class="text-2xl md:text-3xl font-semibold text-slate-900 tracking-tighter">Department Management</h1>
            <p class="text-xs font-medium text-slate-400 uppercase tracking-widest mt-1">Manage office structure and
                teams
            </p>
        </div>
        <button
            class="bg-brand-1 text-white px-6 py-3 rounded-2xl font-semibold text-xs uppercase tracking-widest shadow-lg shadow-brand-1/20 hover:bg-brand-5 transition-all flex items-center gap-2 w-fit">
            <span class="material-symbols-outlined text-sm">add_business</span>
            Create Department
        </button>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        <div *ngFor="let dept of departments()"
            class="bg-white p-6 rounded-[2rem] shadow-xl border border-slate-100 hover:border-brand-1 transition-all group overflow-hidden relative">
            <div
                class="absolute top-0 right-0 w-32 h-32 bg-brand-1/5 rounded-full -mr-16 -mt-16 group-hover:scale-150 transition-transform duration-700">
            </div>

            <div class="relative z-10">
                <div class="flex items-center gap-4 mb-6">
                    <div
                        class="w-12 h-12 bg-brand-1/10 rounded-2xl flex items-center justify-center text-brand-1 group-hover:bg-brand-1 group-hover:text-white transition-all shrink-0">
                        <span class="material-symbols-outlined uppercase">lan</span>
                    </div>
                    <div>
                        <h3 class="text-lg font-semibold text-slate-800 leading-tight">{{dept.name}}</h3>
                        <p class="text-[10px] font-medium text-slate-400 uppercase tracking-widest mt-1">Head: {{dept.head}}</p>
                    </div>
                </div>

                <div class="flex items-center justify-between pt-6 border-t border-slate-50">
                    <div class="flex items-center gap-2">
                        <span class="material-symbols-outlined text-slate-400 text-sm">groups</span>
                        <span class="text-xs font-semibold text-slate-600 uppercase">{{dept.count}} Employees</span>
                    </div>
                    <button
                        class="text-brand-1 hover:text-brand-5 font-semibold text-[10px] uppercase tracking-widest flex items-center gap-1">
                        View Details
                        <span class="material-symbols-outlined text-[14px]">arrow_forward</span>
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
