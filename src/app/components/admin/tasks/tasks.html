<div class="p-4 md:p-8 animate-in fade-in slide-in-from-bottom-5 duration-500">
    <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-8">
        <div>
            <h1 class="text-2xl md:text-3xl font-black text-slate-900 tracking-tighter">Task Management</h1>
            <p class="text-xs font-bold text-slate-400 uppercase tracking-widest mt-1">Assign and monitor office tasks
            </p>
        </div>
        <button
            class="bg-brand-1 text-white px-6 py-3 rounded-2xl font-black text-xs uppercase tracking-widest shadow-lg shadow-brand-1/20 hover:bg-brand-5 transition-all flex items-center gap-2 w-fit">
            <span class="material-symbols-outlined text-sm">assignment_add</span>
            Create Task
        </button>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div *ngFor="let task of tasks()"
            class="bg-white p-6 rounded-[2rem] shadow-xl border border-slate-100 flex items-center justify-between group hover:border-brand-1 transition-all">
            <div class="flex items-center gap-5">
                <div
                    class="w-12 h-12 bg-slate-50 rounded-2xl flex items-center justify-center text-slate-400 group-hover:bg-brand-1/10 group-hover:text-brand-1 transition-all">
                    <span class="material-symbols-outlined text-[28px]">task</span>
                </div>
                <div>
                    <h3 class="text-sm font-black text-slate-800 mb-1">{{task.title}}</h3>
                    <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Assigned:
                        {{task.assignedTo}}</p>
                </div>
            </div>
            <div class="text-right">
                <span [class]="'px-3 py-1 rounded-lg text-[9px] font-black uppercase tracking-widest block mb-2 ' + 
                    (task.priority === 'High' ? 'bg-red-100 text-red-500' : 'bg-amber-100 text-amber-500')">
                    {{task.priority}}
                </span>
                <p class="text-[10px] font-black text-slate-300 uppercase tracking-widest">{{task.status}}</p>
            </div>
        </div>
    </div>
</div>
